name: 🧪 Multiplatform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Full Integration Tests (JVM, Java, JS, Swift)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set Up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Multiplatform Test Suite (JVM, Java 17+, JS Browser, JS Node)
        run: ./gradlew check jacocoTestReport

      - name: Run Swift SPM & Apple Interop Test Harness
        if: matrix.os == 'macos-latest'
        run: ./scripts/verify_swift_interop.sh

      - name: Upload JaCoCo Coverage Report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/jacocoTestReport/html/
